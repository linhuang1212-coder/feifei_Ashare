# feifei_Ashare 配置中心 —— 改票/改阈值/改源都在这里,代码不硬编码。
# 所有阈值均为规范默认建议值,可调。

data:
  source: local_db                 # local_db(只读China_quant) | tushare | akshare
  local_db_path: "C:\\Users\\Administrator\\China_quant\\data\\stock_data.db"
  local_db_table: daily_kline_v2
  topup: true                      # 本地库停在建库日(实测 2026-06-05),自动补到 end
  topup_source: akshare            # 缺口补源: akshare(免token) | tushare
  cache: true

start: "2023-01-01"                # 至少留 250 交易日给 MA250 / 年内高低
end: ""                            # 空 = 到今天(用系统时钟)

# 自选股(占位,待给真实名单)。position_status: EMPTY/HOLDING/WATCHING;
# 持有时填 cost_price 以算盈亏(规范第 8 章)。
watchlist:
  - { code: "601869", name: "长飞光纤" }
  - { code: "600487", name: "亨通光电" }
  - { code: "688146", name: "中船特气" }
  - { code: "000636", name: "风华高科" }
  - { code: "688308", name: "欧科亿" }
  - { code: "603629", name: "利通电子" }
  - { code: "301362", name: "民爆光电" }
  - { code: "600396", name: "华电辽能" }

periods:
  ma:   [5, 10, 20, 60, 120, 250]
  macd: [12, 26, 9]
  kdj:  [9, 3, 3]
  rsi:  [6, 12, 14]
  atr:  14
  boll: [20, 2]

thresholds:
  vol_surge: 2.0
  vol_shrink: 0.7
  turnover_active: 7.0
  turnover_extreme: 25.0
  atr_n: 3.0
  chip_concentrated: 0.15
  profit_ratio_high: 0.90

scoring_weights: { trend: 0.35, volume: 0.25, position: 0.20, chip: 0.20 }

# ===== v2.0 =====
market_filter:
  index_codes: ["000001", "399006"]   # 上证 + 创业板(本地无→akshare取);从严合成:任一防守即防守
  risk_off_action: pause_buy
take_profit:
  min_risk_reward: 1.5             # 盈亏比低于此值的买入信号丢弃
  trailing_drawdown_tech: 0.18     # 科技股移动止盈回撤
  trailing_drawdown_stable: 0.12
confirmation:
  require_next_day_confirm: true   # 突破/跌破需次日确认
  buy_signal_expire_days: 5
  cooldown_days_after_stop: 3
board_adjustment:
  star_market_multiplier: 1.4      # 科创/创业板阈值上浮
alerts:
  min_push_level: "S2"
  channels: []                     # 待定: [feishu] / [email]

# ===== P1.5 回测 =====
backtest:
  entry_levels: ["B2", "B3"]       # 达到这些买入级别才入场
  exit_levels: ["S2", "S3"]        # 达到这些卖出级别就离场
  fill: next_open                  # 次日开盘成交(决策用收盘≤T,成交在T+1,无未来函数)
  oos_split: ""                    # 样本外切分日如 "2025-07-01";空=不切
costs:                             # A股真实成本(实盘前按券商校准)
  commission: 0.00025              # 佣金 双边(万2.5)
  min_commission: 5.0              # 最低佣金(rate模型暂不计,留待加资金/手数)
  stamp_tax: 0.0005                # 印花税 仅卖出(2023-08起 0.05%)
  transfer_fee: 0.00001            # 过户费 双边
  slippage: 0.0005                 # 滑点 单边

# ===== v2.1 多周期 + 钝化调权(P3.5) =====
# 验证结论(2026-06-28,中性40票A/B回测):周线门控(enable)使收益变差(B+5% vs A+22%,
# B优于A仅42%),证伪→默认关闭门控。周线背景仍由 enrich 常驻计算供仪表盘显示(不受此开关影响)。
multi_period:
  enable: false                    # 信号侧周线门控:经回测证伪,关闭(周线背景显示不受影响)
  weekly_ma: [5, 10, 20, 30]       # 周线均线,MA20/30 为中期牛熊线
  weekly_gate_exits: true          # (仅 enable=true 时生效)周线多头站上生命线忽略ATR止损
blunt_detection:                   # 日线钝化检测(暂存配置,P3.5 第二步接入)
  enable: true
  kdj_blunt_days: 6
  kdj_blunt_j_high: 90
  kdj_blunt_j_low: 10
  rsi_blunt_high: 80
  rsi_blunt_low: 20

output:
  db_path: data/feifei.db
  fig_dir: out
logging:
  level: INFO
  file: logs/feifei.log
